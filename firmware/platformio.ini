[env:lilygo-t4-v13]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.30
    adafruit/Adafruit ADS1X15 @ ^2.4.0
    robtillaart/PCF8574 @ ^0.4.1
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    knolleary/PubSubClient @ ^2.8

build_flags = 
    ; System Config
    -D USER_SETUP_LOADED=1
    
    ; Driver: ILI9341
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    
    ; Pinout Configuration (Master Context)
    -D TFT_MISO=12
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_RST=33
    -D TFT_BL=4
    
    ; Font Loading
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
site_name: RDWC Auto-Doser T4
site_url: https://lukirch1984.github.io/rdwc-autodoser-t4/
repo_url: https://github.com/lukirch1984/rdwc-autodoser-t4
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: purple
    - scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - content.code.copy

# Internationalization
extra:
  alternate:
    - name: English
      link: ./ 
      lang: en
    - name: Deutsch
      link: ./de/
      lang: de

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: de
          name: Deutsch
          build: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Hardware:
      - 'Wiring Guide': wiring.md
      - 'Bill of Materials': bom.md
      - 'Sensor Setup': guide_ph_sensor.md
      - 'Pump Setup': guide_relays_pumps.md
  - Software:
      - 'Usage Guide': usage.md
      - 'Versioning': versioning.md
  - Community:
      - 'Contributing': contributing.md
